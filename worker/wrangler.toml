name = "jwic-vat"
main = "vat-proxy.js"
compatibility_date = "2026-01-01"

# ต้องระบุเอง — พอมี [[routes]] แล้ว wrangler จะปิด workers.dev ให้อัตโนมัติ
workers_dev = true

# ถ้ากรมสรรพากรออกบัญชีให้ ใช้ `npx wrangler secret put RD_USER` แทนการแก้โค้ด
# ไม่ตั้ง = ใช้ anonymous/anonymous ซึ่งใช้งานได้อยู่แล้ว

# 20 ครั้ง/นาที/IP — เดโมหน้าเว็บใช้ไม่ถึง แต่กันเอาไปไล่ขูดทะเบียน
[[unsafe.bindings]]
name = "RL"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 20, period = 60 }

# custom domain ของ worker — deploy แล้ว Cloudflare สร้าง DNS record + cert ของ api ให้เอง
# เดิมผูก route www.jwicconsulting.com/api/vat* ซึ่งต้องเปิดเมฆส้มให้ www
# แล้ว GitHub Pages ต่อ cert ของ www ไม่ได้ (หมดอายุ 18 ต.ค. 2026 เว็บขึ้น 526) — www ต้องเป็นเมฆเทาเสมอ
[[routes]]
pattern = "api.jwicconsulting.com"
custom_domain = true
