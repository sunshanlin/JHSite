<!DOCTYPE html>

    @font-face { font-family: 'Sarabun'; font-style: normal; font-weight: 400; font-display: swap; src: url(/css/fonts/sarabun-latin-ext-400.woff2) format('woff2'); unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF; }

    :root {
      color-scheme: light;
      font-family: "Anuphan", "Segoe UI", "Leelawadee UI", Tahoma, sans-serif;
      color: #122e33;
      background: #f2f9f7;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
    }
    main {
      width: min(620px, 100%);
      padding: clamp(32px, 7vw, 64px);
      text-align: center;
      background: #fff;
      border: 1px solid #bee3df;
      border-radius: 24px;
      box-shadow: 0 20px 60px -32px rgba(13, 82, 87, .4);
    }
    p:first-child {
      margin: 0;
      color: #1f7a87;
      font-size: clamp(64px, 18vw, 112px);
      font-weight: 700;
      line-height: 1;
    }
    h1 { margin: 18px 0 10px; color: #0d5257; }
    p { line-height: 1.7; }
    p:not(:first-child) { font-family: "Sarabun", "Anuphan", "Segoe UI", "Leelawadee UI", Tahoma, sans-serif; font-size: 18px; }
    a {
      display: inline-block;
      margin-top: 16px;
      padding: 12px 22px;
      color: #fff;
      font-weight: 700;
      text-decoration: none;
      background: #0d5257;
      border-radius: 999px;
    }
    a:hover { background: #1f7a87; }

  <main>
