name: links
on: [push, pull_request]

# ponytail: offline only — เช็คว่าลิงก์/รูปภายในไม่ 404 พอ
# ถ้าอยากเช็คลิงก์นอก (docs.microsoft ฯลฯ) เอา --offline ออก แล้วรับความ flaky
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: lycheeverse/lychee-action@v2
        with:
          # --exclude '^/#...' : ลิงก์ข้ามหน้ากลับ index.html#section (เช่น /#contact) —
          # lychee resolve "/" เป็นโฟลเดอร์ ไม่ใช่ index.html เลยหา fragment ไม่เจอ (false positive)
          args: >-
            --offline --no-progress --include-fragments --root-dir "$GITHUB_WORKSPACE"
            --exclude "^/#(contact|articles)$"
            "*.html" "articles/*.html"
          fail: true
